# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Site settings
title: Autonity SDK Documentation
email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  TypeScript SDK for interacting with the Autonity blockchain.
  Comprehensive documentation for developers.
baseurl: "/autonity-sdk" # the subpath of your site, e.g. /blog
url: "https://adanothe.github.io" # the base hostname & protocol for your site

# GitHub repository
github_username: adanothe
repository: "adanothe/autonity-sdk"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Remote theme for GitHub Pages
remote_theme: just-the-docs/just-the-docs

# Color scheme
color_scheme: dark

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation structure
nav_sort: case_insensitive # default, equivalent to nil
nav_fold: true # fold navigation by default

# Footer content
footer_content: "Copyright &copy; 2024 Autonity SDK. Distributed under the MIT License."

# Footer links
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/adanothe/autonity-sdk"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - script/
  - src/
  - package.json
  - package-lock.json
  - tsconfig.json
  - README-old.md

# Collections
collections:
  api:
    output: true
    permalink: /:collection/:name/
  types:
    output: true
    permalink: /:collection/:name/
  examples:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: "api"
    values:
      layout: "default"
      parent: "API Reference"
  -
    scope:
      path: "types"
    values:
      layout: "default"
      parent: "Type Definitions"
  -
    scope:
      path: "examples"
    values:
      layout: "default"
      parent: "Examples"
